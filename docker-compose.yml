services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: multigym
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/multigym
      PORT: 3000
      FRONTEND_URL: http://localhost:5173
      BIOMETRIC_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    depends_on: [db]
    ports: ["3000:3000"]
volumes:
  pgdata:
