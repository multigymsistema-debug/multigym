name: Validate MultiGym
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: multigym_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d multigym_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package.json
      - run: npm install
      - run: npm run build
      - run: npm test
      - name: Start API for integration tests
        run: npm start > /tmp/multigym-api.log 2>&1 &
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/multigym_test
          FRONTEND_URL: http://localhost:5173
          BIOMETRIC_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      - name: Wait for API
        run: for i in {1..30}; do curl --fail http://127.0.0.1:3000/health && exit 0 || sleep 2; done; cat /tmp/multigym-api.log; exit 1
      - name: Run API integration tests
        run: npm run test:integration || (cat /tmp/multigym-api.log; exit 1)
        env:
          TEST_API_URL: http://127.0.0.1:3000
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package.json
      - run: npm install
      - run: npm run build
