services:
  - type: web
    name: multigym-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: multigym-db
          property: connectionString
      - key: FRONTEND_URL
        sync: false
      - key: NODE_ENV
        value: production
databases:
  - name: multigym-db
    databaseName: multigym
    user: multigym
