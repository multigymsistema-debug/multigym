services:
  - type: web
    name: multigym-api
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: multigym-db
          property: connectionString
      - key: FRONTEND_URL
        sync: false
      - key: BIOMETRIC_ENCRYPTION_KEY
        sync: false
      - key: SESSION_DAYS
        value: "14"
databases:
  - name: multigym-db
    databaseName: multigym
    user: multigym
