<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#c91524"><title>MultiGym — Sistema para academias</title><style>:root{font-family:Inter,system-ui,sans-serif;color:#202124;background:#f7f7f8}*{box-sizing:border-box}body{margin:0}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#fff,#fff4f4)}.box{width:min(420px,calc(100% - 32px));background:#fff;padding:32px;border-radius:18px;box-shadow:0 14px 40px #7f0d1620}.logo{color:#7f0d16;font-size:24px;font-weight:800}.mg{background:#c91524;color:#fff;border-radius:8px;padding:4px 7px;margin-right:8px}.sub{display:block;color:#6b7280;font-size:12px;font-weight:500;margin:10px 0 28px 48px}.box h1{font-size:24px;margin:0 0 8px}.muted{color:#6b7280;font-size:14px}label{display:block;font-size:13px;font-weight:700;margin:12px 0 6px}input,select,textarea{width:100%;padding:11px;border:1px solid #ddd;border-radius:8px;font:inherit}button{border:0;border-radius:8px;background:#c91524;color:#fff;padding:11px 15px;font-weight:800;cursor:pointer}.box button{width:100%;margin-top:18px}.error{color:#b42318;background:#fff1f0;padding:10px;border-radius:8px;font-size:13px;margin-top:14px}.app{min-height:100vh;display:flex}.side{width:245px;background:#7f0d16;color:#fff;padding:24px 16px;display:flex;flex-direction:column}.side .logo{color:#fff}.side .mg{background:#fff;color:#c91524}.nav{margin-top:30px;display:grid;gap:5px}.nav a{padding:10px 12px;color:#fbe7e8;border-radius:8px;text-decoration:none;cursor:pointer}.nav a.active,.nav a:hover{background:#a51420;color:#fff}.side small{margin-top:auto;color:#f5c5c8}.main{flex:1;padding:28px clamp(18px,5vw,60px);max-width:1400px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.top h1{margin:0;color:#7f0d16}.logout{background:#fff;color:#7f0d16;border:1px solid #e5b5b8}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card,.panel{background:#fff;padding:20px;border-radius:14px;box-shadow:0 2px 12px #2210150d}.card p{margin:0;color:#6b7280;font-size:13px}.card strong{display:block;color:#7f0d16;font-size:28px;margin-top:14px}.panel{margin-top:20px}.panel h2{margin:0 0 16px;font-size:18px}.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:16px}.toolbar input{max-width:300px}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:11px 8px;border-bottom:1px solid #eee;font-size:13px}.table th{color:#6b7280}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.formgrid .full{grid-column:1/-1}.form-actions{display:flex;justify-content:flex-end;margin-top:14px}.toast{position:fixed;right:20px;bottom:20px;background:#14804a;color:#fff;padding:13px 17px;border-radius:9px}.empty{padding:25px;text-align:center;color:#6b7280}@media(max-width:760px){.side{width:70px;padding:20px 9px}.side .sub,.side small,.nav a{font-size:0}.nav a:before{content:'•';font-size:24px}.grid{grid-template-columns:repeat(2,1fr)}.table{display:block;overflow:auto}}@media(max-width:480px){.main{padding:18px 12px}.grid,.formgrid{grid-template-columns:1fr}.top{align-items:flex-start;gap:10px;flex-direction:column}}
</style></head><body><section id="login" class="login"><div class="box"><div class="logo"><span class="mg">MG</span>MultiGym</div><span class="sub">Sistema para academias</span><h1>Entrar no sistema</h1><p class="muted">Acesse o ambiente da sua academia.</p><form id="loginForm"><label>E-mail</label><input id="email" type="email" required><label>Senha</label><input id="password" type="password" required><button>Entrar</button><div id="loginError" class="error hidden"></div></form></div></section><section id="app" class="app hidden"><aside class="side"><div class="logo"><span class="mg">MG</span>MultiGym</div><span class="sub">Sistema para academias</span><nav class="nav"><a data-tab="dashboard" class="active">Dashboard</a><a data-tab="students">Alunos</a><a data-tab="plans">Planos</a><a data-tab="enrollments">Matrículas</a><a data-tab="workouts">Treinos</a><a data-tab="payments">Financeiro</a><a data-tab="appointments">Agenda</a></nav><small id="user"></small></aside><main class="main"><div class="top"><div><h1 id="title">Dashboard</h1><p class="muted">Gestão simples e profissional</p></div><button id="logout" class="logout">Sair</button></div><div id="view"></div></main></section><div id="toast" class="toast hidden"></div><script>const API='https://multigym-api.onrender.com';const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s);const token=()=>sessionStorage.getItem('mg_token');async function api(path,opt={}){const r=await fetch(API+path,{...opt,headers:{'Content-Type':'application/json',Authorization:'Bearer '+token(),...(opt.headers||{})}});const d=await r.json();if(!r.ok)throw Error(d.error||'Não foi possível concluir.');return d}function toast(t){const x=$('#toast');x.textContent=t;x.classList.remove('hidden');setTimeout(()=>x.classList.add('hidden'),2500)}function table(rows,cols){if(!rows.length)return '<div class="empty">Nenhum registro encontrado.</div>';return '<table class="table"><thead><tr>'+cols.map(c=>'<th>'+c[1]+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+cols.map(c=>'<td>'+(r[c[0]]??'—')+'</td>').join('')+'</tr>').join('')+'</tbody></table>'}function form(fields,action){return '<form class="panel" id="dataForm"><div class="formgrid">'+fields.map(f=>'<div class="'+(f.full?'full':'')+'"><label>'+f.label+'</label>'+(f.type==='select'?'<select name="'+f.name+'" required>'+f.options.map(o=>'<option value="'+o[0]+'">'+o[1]+'</option>').join('')+'</select>':'<input name="'+f.name+'" type="'+(f.type||'text')+'" '+(f.required===false?'':'required')+'>')+'</div>').join('')+'</div><div class="form-actions"><button>Salvar</button></div></form>'}async function render(tab){$('.nav a.active')?.classList.remove('active');$('[data-tab="'+tab+'"]').classList.add('active');$('#title').textContent={dashboard:'Dashboard',students:'Alunos',plans:'Planos',enrollments:'Matrículas',workouts:'Treinos',payments:'Financeiro',appointments:'Agenda'}[tab];try{if(tab==='dashboard'){const d=await api('/api/dashboard');$('#view').innerHTML='<div class="grid"><div class="card"><p>Alunos ativos</p><strong>'+d.students+'</strong></div><div class="card"><p>Matrículas em atenção</p><strong>'+d.enrollments_attention+'</strong></div><div class="card"><p>Faturamento do mês</p><strong>R$ '+Number(d.revenue).toFixed(2).replace('.',',')+'</strong></div><div class="card"><p>Agenda de hoje</p><strong>'+d.appointments+'</strong></div></div><div class="panel"><h2>Bem-vindo, '+d.gym+'</h2><p class="muted">Use o menu para cadastrar alunos, planos, matrículas, pagamentos, treinos e compromissos.</p></div>'}if(tab==='students'){const rows=await api('/api/students');$('#view').innerHTML='<div class="toolbar"><input id="search" placeholder="Buscar aluno..."><button id="new">+ Novo aluno</button></div><div id="list">'+table(rows,[['full_name','Nome'],['phone','Telefone'],['email','E-mail'],['status','Status']])+'</div>';$('#search').oninput=async e=>$('#list').innerHTML=table(await api('/api/students?q='+encodeURIComponent(e.target.value)),[['full_name','Nome'],['phone','Telefone'],['email','E-mail'],['status','Status']]);$('#new').onclick=()=>$('#view').insertAdjacentHTML('beforeend',form([{name:'full_name',label:'Nome completo'},{name:'phone',label:'Telefone',required:false},{name:'email',label:'E-mail',required:false,type:'email'},{name:'cpf',label:'CPF',required:false}],'/api/students'))}if(tab==='plans'){const rows=await api('/api/plans');$('#view').innerHTML='<div class="toolbar"><button id="new">+ Novo plano</button></div>'+table(rows,[['name','Plano'],['price','Valor'],['duration_days','Duração (dias)'],['status','Status']]);$('#new').onclick=()=>$('#view').insertAdjacentHTML('beforeend',form([{name:'name',label:'Nome do plano'},{name:'price',label:'Valor',type:'number'},{name:'duration_days',label:'Duração em dias',type:'number'}],'/api/plans'))}if(tab==='enrollments'){const rows=await api('/api/enrollments');$('#view').innerHTML=table(rows,[['student_name','Aluno'],['plan_name','Plano'],['starts_on','Início'],['ends_on','Vencimento'],['status','Status']])}if(tab==='payments'){const rows=await api('/api/payments');$('#view').innerHTML=table(rows,[['student_name','Aluno'],['amount','Valor'],['method','Forma'],['status','Status'],['paid_at','Data']])}if(tab==='appointments'){const rows=await api('/api/appointments');$('#view').innerHTML=table(rows,[['title','Compromisso'],['type','Tipo'],['starts_at','Início'],['student_name','Aluno']])}if(tab==='workouts'){const rows=await api('/api/workouts');$('#view').innerHTML=table(rows,[['name','Treino'],['student_name','Aluno'],['objective','Objetivo'],['review_on','Revisão'],['status','Status']])}}catch(e){$('#view').innerHTML='<div class="panel error">'+e.message+'</div>}}document.addEventListener('click',e=>{const a=e.target.closest('[data-tab]');if(a)render(a.dataset.tab);if(e.target.id==='logout'){sessionStorage.clear();location.reload()}if(e.target.closest('#dataForm')){const f=e.target.closest('#dataForm');if(e.target.tagName==='BUTTON'){e.preventDefault();const data=Object.fromEntries(new FormData(f));const path=f.getAttribute('id')==='dataForm'?(f.parentElement.innerHTML.includes('Plano')?'/api/plans':'/api/students'):null;if(path)api(path,{method:'POST',body:JSON.stringify(data)}).then(()=>{toast('Salvo com sucesso.');render(path.includes('plans')?'plans':'students')}).catch(x=>toast(x.message))}}});$('#loginForm').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('button'),er=$('#loginError');b.disabled=true;try{const d=await fetch(API+'/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('#email').value,password:$('#password').value})}).then(async r=>{const x=await r.json();if(!r.ok)throw Error(x.error);return x});sessionStorage.setItem('mg_token',d.token);sessionStorage.setItem('mg_user',JSON.stringify(d.user));location.reload()}catch(x){er.textContent=x.message;er.classList.remove('hidden')}finally{b.disabled=false}};if(sessionStorage.getItem('mg_token')){$('#login').classList.add('hidden');$('#app').classList.remove('hidden');$('#user').textContent=JSON.parse(sessionStorage.getItem('mg_user')).name;render('dashboard')}</script></body></html>
